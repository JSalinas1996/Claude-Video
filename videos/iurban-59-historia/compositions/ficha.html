<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="ficha">
      <style>
        #ficha-root { position: absolute; inset: 0; overflow: hidden; }
        #ficha-img { object-position: 50% 50%; filter: blur(18px) brightness(0.55); transform: scale(1.08); }
        #ficha-tint { background: rgba(27,27,25,0.35); }
        #ficha-g .rule { margin: 26px 0 30px; }
        #ficha-g .body { margin-top: 26px; }
      </style>
      <div id="ficha-root" data-composition-id="ficha" data-width="1080" data-height="1920">
        <img class="media" id="ficha-img" data-layout-allow-overflow src="assets/images/living.jpg" alt="" />
        <div class="layer" id="ficha-tint"></div>
        <div class="layer copy">
          <div class="group" id="ficha-g">
            <span class="kicker" id="ficha-k">Unidad tipo</span>
            <span class="rule" id="ficha-r"></span>
            <span class="display" id="ficha-t">59 m²</span>
            <span class="body" id="ficha-b">1 dormitorio · 2 ambientes · balcón</span>
          </div>
        </div>
      </div>
      <script>
        // Tiempos locales (s). Slot: 27.5 → 29.9 global.
        const T = { k: 0.35, r: 0.5, t: 0.6, b: 0.85 };
        const IN = { dur: 0.9, ease: "power3.out", y: 24 };
        const enter = (tl, sel, at, y = IN.y, dur = IN.dur) =>
          tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: IN.ease }, at);
        const leave = (tl, sel, at) =>
          tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, at);
        const draw = (tl, sel, at, dur = 0.8) =>
          tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "power2.inOut" }, at);
        Promise.all([
          document.fonts.load('400 110px "Instrument Serif"'),
          document.fonts.load('400 38px "Hanken Grotesk"'),
          document.fonts.load('500 26px "Hanken Grotesk"'),
        ]).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#ficha-root", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 0);
          enter(tl, "#ficha-k", T.k, 16);
          draw(tl, "#ficha-r", T.r);
          enter(tl, "#ficha-t", T.t, 30, 1.0);
          enter(tl, "#ficha-b", T.b, 18);
          window.__timelines["ficha"] = tl;
        });
      </script>
    </template>
  </body>
</html>
