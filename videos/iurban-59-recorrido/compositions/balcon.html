<!DOCTYPE html>
<html lang="es">
  <head><meta charset="UTF-8"></head>
  <body>
    <template id="balcon">
      <style>
        #balcon-root { position: absolute; inset: 0; overflow: hidden; }
        /* Encuadre: ventanal del balcón + comedor (continúa el punto de vista del final del recorrido) */
        #balcon-img { object-position: 40% 50%; }
        /* Origen del acercamiento: el ventanal */
        #balcon-cam { transform-origin: 300px 640px; }
        #balcon-g .index { margin-bottom: 18px; }
      </style>
      <div data-hf-id="hf-8qqb" id="balcon-root" data-composition-id="balcon" data-width="1080" data-height="1350">
        <div data-hf-id="hf-8r3f" class="cam" id="balcon-cam" data-layout-allow-overflow="">
          <img data-hf-id="hf-vhk5" class="media" id="balcon-img" src="assets/images/balcon-graded.jpg" alt="">
        </div>
        <div data-hf-id="hf-r2cb" class="layer scrim-bottom"></div>
        <div data-hf-id="hf-l0sq" class="layer copy">
          <div data-hf-id="hf-1c2g" class="group" id="balcon-g">
            <span data-hf-id="hf-4sqt" class="index">02</span>
            <span data-hf-id="hf-tmig" class="label">Balcón</span>
          </div>
        </div>
      </div>
      <script>
        // Tiempos locales (s). Slot: 17.45 → 20.2 global.
        const T = { fade: 0, focus: 0.55, caption: 0.6, dur: 2.75 };
        const IN = { dur: 0.9, ease: "power3.out", y: 24 };
        const enter = (tl, sel, at, y = IN.y, dur = IN.dur) =>
          tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: IN.ease }, at);
        Promise.all([
          document.fonts.load('400 92px "Instrument Serif"'),
          document.fonts.load('500 22px "Hanken Grotesk"'),
        ]).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          // Llegada en foco (continúa el desenfoque de salida del recorrido)
          tl.fromTo("#balcon-root", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, T.fade);
          tl.fromTo("#balcon-img", { filter: "blur(12px)" },
            { filter: "blur(0px)", duration: T.focus, ease: "power2.out" }, T.fade);
          // Acercamiento lento hacia el ventanal
          tl.fromTo("#balcon-cam", { scale: 1.0 }, { scale: 1.09, duration: T.dur, ease: "sine.inOut" }, 0);
          enter(tl, "#balcon-g .index", T.caption, 14);
          enter(tl, "#balcon-g .label", T.caption + 0.12, 24);
          window.__timelines["balcon"] = tl;
        });
      </script>
    </template>
  </body>
</html>
