<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="marca">
      <style>
        #marca-root { position: absolute; inset: 0; pointer-events: none; }
        #marca-bar { position: absolute; left: var(--gutter); right: var(--gutter); top: 56px;
          display: flex; justify-content: space-between; align-items: center; }
        #marca-logo { display: block; width: 168px; height: auto; }
        #marca-dir { font-weight: 500; font-size: var(--t-meta); letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.9); }
      </style>
      <div id="marca-root" data-composition-id="marca" data-width="1080" data-height="1350">
        <div class="layer scrim-top" id="marca-scrim"></div>
        <div id="marca-bar">
          <img id="marca-logo" src="assets/images/logo-blanco.png" alt="Iurban" />
          <span id="marca-dir">59 e/ 9 y 10</span>
        </div>
      </div>
      <script>
        // Tiempos locales (s). Slot: 6.4 → 23.4 global.
        const T = { in: 0.3, out: 16.2 };
        const IN = { dur: 0.9, ease: "power3.out", y: 24 };
        const OUT = { dur: 0.45, ease: "power2.in" };
        const enter = (tl, sel, at, y = IN.y, dur = IN.dur) =>
          tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: IN.ease }, at);
        const leave = (tl, sel, at) =>
          tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: OUT.dur, ease: OUT.ease, immediateRender: false }, at);
        const draw = (tl, sel, at, dur = 0.8) =>
          tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "power2.inOut" }, at);
        Promise.all([
          document.fonts.load('400 92px "Instrument Serif"'),
          document.fonts.load('italic 400 92px "Instrument Serif"'),
          document.fonts.load('400 32px "Hanken Grotesk"'),
          document.fonts.load('500 22px "Hanken Grotesk"'),
        ]).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#marca-root", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, T.in);
          tl.fromTo("#marca-root", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "sine.inOut", immediateRender: false }, T.out);
          window.__timelines["marca"] = tl;
        });
      </script>
    </template>
  </body>
</html>
