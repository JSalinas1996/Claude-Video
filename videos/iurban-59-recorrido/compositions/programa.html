<!DOCTYPE html>
<html lang="es">
  <head><meta charset="UTF-8"></head>
  <body>
    <template id="programa">
      <style>
        #programa-root { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
        .programa-panel { position: absolute; left: 0; width: 1080px; height: 640px; overflow: hidden; }
        #programa-p1 { top: 0; }
        #programa-p2 { top: 710px; }
        #programa-cocina { object-position: 50% 55%; }
        #programa-lavadero { object-position: 50% 60%; }
        .programa-panel .copy { padding: 0 var(--gutter) 44px; }
        .programa-panel .index { margin-bottom: 14px; }
        .programa-panel .label { font-size: 56px; }
      </style>
      <div data-hf-id="hf-d2zj" id="programa-root" data-composition-id="programa" data-width="1080" data-height="1350">
        <div data-hf-id="hf-wr2p" class="programa-panel" id="programa-p1">
          <div data-hf-id="hf-55re" class="cam" id="programa-cam1" data-layout-allow-overflow="">
            <img data-hf-id="hf-4sv5" class="media" id="programa-cocina" src="assets/images/cocina-graded.jpg" alt="">
          </div>
          <div data-hf-id="hf-r2cb" class="layer scrim-bottom"></div>
          <div data-hf-id="hf-l0sq" class="layer copy">
            <div data-hf-id="hf-nlki" class="group" id="programa-l1">
              <span data-hf-id="hf-571u" class="index">03</span>
              <span data-hf-id="hf-61mm" class="label">Cocina</span>
            </div>
          </div>
        </div>
        <div data-hf-id="hf-0p6q" class="programa-panel" id="programa-p2">
          <div data-hf-id="hf-17nd" class="cam" id="programa-cam2" data-layout-allow-overflow="">
            <img data-hf-id="hf-kcjv" class="media" id="programa-lavadero" src="assets/images/lavadero-graded.jpg" alt="">
          </div>
          <div data-hf-id="hf-9m1n" class="layer scrim-bottom"></div>
          <div data-hf-id="hf-a5u6" class="layer copy">
            <div data-hf-id="hf-jngh" class="group" id="programa-l2">
              <span data-hf-id="hf-76kz" class="index">04</span>
              <span data-hf-id="hf-29fv" class="label">Lavadero independiente</span>
            </div>
          </div>
        </div>
      </div>
      <script>
        // Tiempos locales (s). Slot: 19.9 → 23.8 global.
        const T = { fade: 0, p1: 0.15, p2: 0.45, l1: 0.75, l2: 1.05, dur: 3.9 };
        const IN = { dur: 0.9, ease: "power3.out", y: 24 };
        const OUT = { dur: 0.45, ease: "power2.in" };
        const enter = (tl, sel, at, y = IN.y, dur = IN.dur) =>
          tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: IN.ease }, at);
        const leave = (tl, sel, at) =>
          tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: OUT.dur, ease: OUT.ease, immediateRender: false }, at);
        const draw = (tl, sel, at, dur = 0.8) =>
          tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "power2.inOut" }, at);
        Promise.all([
          document.fonts.load('400 92px "Instrument Serif"'),
          document.fonts.load('italic 400 92px "Instrument Serif"'),
          document.fonts.load('400 32px "Hanken Grotesk"'),
          document.fonts.load('500 22px "Hanken Grotesk"'),
        ]).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#programa-root", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "sine.inOut" }, T.fade);
          // Paneles: cortina horizontal en sentidos opuestos (díptico editorial)
          tl.fromTo("#programa-p1", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.0, ease: "power3.inOut" }, T.p1);
          tl.fromTo("#programa-p2", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.0, ease: "power3.inOut" }, T.p2);
          tl.fromTo("#programa-cam1", { scale: 1.1 }, { scale: 1.02, duration: T.dur, ease: "power1.out" }, T.p1);
          tl.fromTo("#programa-cam2", { scale: 1.1 }, { scale: 1.02, duration: T.dur, ease: "power1.out" }, T.p2);
          enter(tl, "#programa-l1 .index", T.l1, 12);
          enter(tl, "#programa-l1 .label", T.l1 + 0.12, 20);
          enter(tl, "#programa-l2 .index", T.l2, 12);
          enter(tl, "#programa-l2 .label", T.l2 + 0.12, 20);
          window.__timelines["programa"] = tl;
        });
      </script>
    </template>
  </body>
</html>
