<!DOCTYPE html>
<html lang="es">
  <head><meta charset="UTF-8"></head>
  <body>
    <template id="recorrido">
      <style>
        #recorrido-root { position: absolute; inset: 0; overflow: hidden; }
        #recorrido-video { object-position: 50% 50%; }
        /* Oscurecido más corto que el global: el interior ya es oscuro */
        #recorrido-scrim { background: linear-gradient(to top, rgba(27,27,25,0.62) 0%, rgba(27,27,25,0.3) 18%, rgba(27,27,25,0) 36%); }
        #recorrido-spec .rule { margin: 22px 0 26px; }
        #recorrido-c1 .index { margin-bottom: 18px; }
        #recorrido-spec .body { margin-top: 22px; }
      </style>
      <div data-hf-id="hf-vgcn" id="recorrido-root" data-composition-id="recorrido" data-width="1080" data-height="1350">
        <div data-hf-id="hf-ed7f" class="layer" id="recorrido-wrap">
          <video data-hf-id="hf-y83y" class="media clip" id="recorrido-video" src="assets/video/recorrido-4x5-graded.mp4" muted playsinline data-start="0" data-duration="12.06" data-track-index="0"></video>
        </div>
        <div data-hf-id="hf-r2cb" class="layer" id="recorrido-scrim"></div>

        <div data-hf-id="hf-l0sq" class="layer copy">
          <div data-hf-id="hf-pufh" class="group" id="recorrido-c1">
            <span data-hf-id="hf-5znw" class="index">01</span>
            <span data-hf-id="hf-27a1" class="label">Living comedor</span>
          </div>
        </div>
        <div data-hf-id="hf-a5u6" class="layer copy">
          <div data-hf-id="hf-gqwo" class="group" id="recorrido-spec">
            <span data-hf-id="hf-kipu" class="kicker" id="recorrido-spec-k">Unidad tipo</span>
            <span data-hf-id="hf-ca1v" class="rule" id="recorrido-spec-r"></span>
            <span data-hf-id="hf-k3as" class="display" id="recorrido-spec-t">59 m²</span>
            <span data-hf-id="hf-2y4n" class="body" id="recorrido-spec-b">1 dormitorio · 2 ambientes · balcón</span>
          </div>
        </div>
      </div>
      <script>
        // Tiempos locales (s). Slot: 5.75 → 17.85 global. Video 12.07 s a velocidad real.
        const T = {
          reveal: { at: 0, dur: 0.95 },
          c1: { at: 1.2, out: 4.0 },
          spec: { at: 4.9, out: 8.5 },
          exit: { at: 11.6, dur: 0.47 },
        };
        const IN = { dur: 0.9, ease: "power3.out", y: 24 };
        const OUT = { dur: 0.45, ease: "power2.in" };
        const enter = (tl, sel, at, y = IN.y, dur = IN.dur) =>
          tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: IN.ease }, at);
        const leave = (tl, sel, at) =>
          tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: OUT.dur, ease: OUT.ease, immediateRender: false }, at);
        const draw = (tl, sel, at, dur = 0.8) =>
          tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "power2.inOut" }, at);
        Promise.all([
          document.fonts.load('400 92px "Instrument Serif"'),
          document.fonts.load('italic 400 92px "Instrument Serif"'),
          document.fonts.load('400 32px "Hanken Grotesk"'),
          document.fonts.load('500 22px "Hanken Grotesk"'),
        ]).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          // Llegada desde el vidrio: el interior aparece sobreexpuesto y desenfocado y se asienta
          tl.fromTo("#recorrido-wrap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "sine.inOut" }, T.reveal.at);
          tl.fromTo("#recorrido-wrap", { filter: "brightness(2.0) blur(14px)" },
            { filter: "brightness(1) blur(0px)", duration: T.reveal.dur, ease: "power2.out", immediateRender: false }, T.reveal.at);
          tl.fromTo("#recorrido-wrap", { scale: 1.08 }, { scale: 1, duration: 1.4, ease: "power3.out", immediateRender: false }, T.reveal.at);

          enter(tl, "#recorrido-c1 .index", T.c1.at, 14);
          enter(tl, "#recorrido-c1 .label", T.c1.at + 0.12, 24);
          leave(tl, "#recorrido-c1", T.c1.out);

          enter(tl, "#recorrido-spec-k", T.spec.at, 14);
          draw(tl, "#recorrido-spec-r", T.spec.at + 0.15);
          enter(tl, "#recorrido-spec-t", T.spec.at + 0.25, 30, 1.0);
          enter(tl, "#recorrido-spec-b", T.spec.at + 0.45, 18);
          leave(tl, "#recorrido-spec", T.spec.out);


          // Salida: desenfoque de foco hacia la toma del balcón
          tl.fromTo("#recorrido-wrap", { filter: "brightness(1) blur(0px)" },
            { filter: "brightness(1) blur(14px)", duration: T.exit.dur, ease: "sine.in", immediateRender: false }, T.exit.at);
          window.__timelines["recorrido"] = tl;
        });
      </script>
    </template>
  </body>
</html>
