<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* ---------- Tipografías locales (marca Iurban) ---------- */
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("assets/fonts/hanken-grotesk-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("assets/fonts/hanken-grotesk-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }

      /* ---------- Design tokens (4:5 feed) ---------- */
      :root {
        --ink: #1b1b19;
        --stone: #f3f1ec;
        --line: #dcd8ce;
        --paper: #ffffff;
        --serif: "Instrument Serif", serif;
        --sans: "Hanken Grotesk", sans-serif;

        --gutter: 72px;
        --top: 72px;
        --bottom: 96px;

        --t-display: 128px;
        --t-title: 92px;
        --t-label: 64px;
        --t-kicker: 22px;
        --t-body: 32px;
        --t-meta: 20px;
        --t-cta: 70px;
        --t-phone: 40px;

        --rule-w: 96px;
        --rule-h: 2px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--sans);
        color: var(--paper);
        -webkit-font-smoothing: antialiased;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }

      /* ---------- Clases compartidas por las escenas ---------- */
      .layer {
        position: absolute;
        inset: 0;
      }
      .bg-ink {
        background: var(--ink);
      }
      .media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cam {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .scrim-bottom {
        background: linear-gradient(
          to top,
          rgba(27, 27, 25, 0.78) 0%,
          rgba(27, 27, 25, 0.45) 24%,
          rgba(27, 27, 25, 0) 50%
        );
      }
      .scrim-top {
        background: linear-gradient(to bottom, rgba(27, 27, 25, 0.45) 0%, rgba(27, 27, 25, 0) 18%);
      }
      .copy {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-start;
        padding: var(--top) var(--gutter) var(--bottom);
      }
      .group {
        width: 100%;
        max-width: 900px;
      }
      .kicker {
        display: block;
        font-weight: 500;
        font-size: var(--t-kicker);
        letter-spacing: 6px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.88);
      }
      .rule {
        display: block;
        width: var(--rule-w);
        height: var(--rule-h);
        background: var(--paper);
        transform-origin: 0% 50%;
      }
      .display,
      .title,
      .label {
        display: block;
        font-family: var(--serif);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.5px;
      }
      .display {
        font-size: var(--t-display);
      }
      .title {
        font-size: var(--t-title);
      }
      .label {
        font-size: var(--t-label);
      }
      em {
        font-style: italic;
      }
      .body {
        display: block;
        font-weight: 400;
        font-size: var(--t-body);
        line-height: 1.3;
        color: var(--line);
      }
      .index {
        display: block;
        font-weight: 500;
        font-size: var(--t-meta);
        letter-spacing: 4px;
        color: rgba(255, 255, 255, 0.85);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1080"
      data-height="1350"
    >
      <div id="base" class="layer bg-ink clip" data-start="0" data-duration="24" data-track-index="0"></div>

      <!-- Escenas (tiempos globales). Los solapes son las transiciones. -->
      <div id="el-fachada" data-composition-id="fachada" data-composition-src="compositions/fachada.html"
        data-start="0" data-duration="6.1" data-track-index="1" data-width="1080" data-height="1350"></div>
      <div id="el-recorrido" data-composition-id="recorrido" data-composition-src="compositions/recorrido.html"
        data-start="5.75" data-duration="12.1" data-track-index="2" data-width="1080" data-height="1350"></div>
      <div id="el-programa" data-composition-id="programa" data-composition-src="compositions/programa.html"
        data-start="17.3" data-duration="3.9" data-track-index="3" data-width="1080" data-height="1350"></div>
      <div id="el-cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html"
        data-start="20.6" data-duration="3.4" data-track-index="4" data-width="1080" data-height="1350"></div>

      <!-- Firma persistente mientras se recorre la unidad -->
      <div id="el-marca" data-composition-id="marca" data-composition-src="compositions/marca.html"
        data-start="6.4" data-duration="14.4" data-track-index="5" data-width="1080" data-height="1350"></div>

      <!-- Fundido de entrada desde ink -->
      <div id="fade-in" class="layer bg-ink clip" data-start="0" data-duration="0.8" data-track-index="6"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#fade-in", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power1.out" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
